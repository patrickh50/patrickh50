<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Connected local AI lab</title>
  <desc id="description">A peer laptop communicates over a Thunderbolt 4 and USB4 network link with NVIDIA PAIR and the Alienware m16 R2. The Alienware uses its RTX 4070 Laptop GPU and system RAM for supported local inference configurations. A brief animated introduction illustrates the request and response workflow, followed by a static view.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#08172c"/>
      <stop offset="1" stop-color="#102c43"/>
    </linearGradient>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="320" y1="0" x2="880" y2="0">
      <stop stop-color="#6ce2df"/>
      <stop offset=".55" stop-color="#a8d9f4"/>
      <stop offset="1" stop-color="#f6bd79"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#77abc8" stroke-opacity=".07"/>
    </pattern>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .kicker { fill:#87b6d2; font-size:12px; letter-spacing:2px; }
      .heading { fill:#eff7ff; font-size:27px; font-weight:600; }
      .label { fill:#eff7ff; font-size:19px; font-weight:600; }
      .detail { fill:#b4cfdf; font-size:14px; }
      .teal { fill:#83e5df; }
      .amber { fill:#f6bd79; }
      .request { animation: request 4.8s ease-in-out 1 both; transform-box:view-box; }
      .response { animation: response 4.8s ease-in-out 1 both; transform-box:view-box; }
      .processing { animation: processing 4.8s ease-in-out 1 both; }
      @keyframes request {
        0%,8% { transform:translateX(0); opacity:0; }
        14% { opacity:1; }
        44% { transform:translateX(494px); opacity:1; }
        49%,100% { transform:translateX(494px); opacity:0; }
      }
      @keyframes response {
        0%,53% { transform:translateX(0); opacity:0; }
        59% { opacity:1; }
        90% { transform:translateX(-494px); opacity:1; }
        96%,100% { transform:translateX(-494px); opacity:0; }
      }
      @keyframes processing {
        0%,35%,70%,100% { opacity:.3; }
        48%,55% { opacity:.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .request,.response { animation:none; opacity:0; }
        .processing { animation:none; opacity:.3; }
      }
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#background)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <text x="44" y="46" class="kicker">APPLIED AI LAB / SYSTEMS IN MOTION</text>
  <text x="44" y="84" class="heading">Two laptops. One practical learning loop.</text>
  <rect x="44" y="119" width="276" height="240" rx="16" fill="#10273a" stroke="#36546a"/>
  <rect x="80" y="147" width="104" height="67" rx="7" fill="#071624" stroke="#83e5df" stroke-width="2"/>
  <path d="M69 224H195L187 232H77Z" fill="#83e5df"/>
  <path d="M97 183H118M107 173L97 183L107 193M130 193H158" fill="none" stroke="#83e5df" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="273" class="label">Peer laptop</text>
  <text x="66" y="301" class="detail">Client tools and prompts</text>
  <text x="66" y="326" class="detail">Responses and artifacts</text>
  <path d="M320 190H880" stroke="url(#link)" stroke-width="2" opacity=".8"/>
  <path d="M880 276H320" stroke="url(#link)" stroke-width="2" opacity=".65"/>
  <path d="M872 185L880 190L872 195M328 271L320 276L328 281" fill="none" stroke="#b6d9e8" stroke-width="2"/>
  <circle cx="345" cy="190" r="5" fill="#a2fbf0" class="request"/>
  <circle cx="839" cy="276" r="5" fill="#ffd29a" class="response"/>
  <rect x="470" y="132" width="260" height="34" rx="17" fill="#122d42" stroke="#4d7084"/>
  <text x="600" y="154" text-anchor="middle" class="detail">Thunderbolt 4 / USB4 network</text>
  <rect x="499" y="211" width="202" height="43" rx="10" fill="#19384e" stroke="#87c7dc"/>
  <text x="600" y="238" text-anchor="middle" class="label">NVIDIA PAIR</text>
  <text x="600" y="312" text-anchor="middle" class="detail">Requests routed to a selected node</text>
  <rect x="880" y="119" width="276" height="240" rx="16" fill="#152a3a" stroke="#806a52"/>
  <rect x="918" y="146" width="102" height="72" rx="8" fill="#071624" stroke="#f6bd79" stroke-width="2"/>
  <rect x="943" y="164" width="52" height="36" rx="4" fill="#f6bd79" opacity=".3" class="processing"/>
  <path d="M933 172H943M933 182H943M933 192H943M995 172H1005M995 182H1005M995 192H1005M953 154V164M967 154V164M981 154V164M953 200V210M967 200V210M981 200V210" stroke="#f6bd79" stroke-width="2"/>
  <text x="902" y="273" class="label">Alienware m16 R2</text>
  <text x="902" y="301" class="detail">RTX 4070 Laptop GPU / 8 GB</text>
  <text x="902" y="326" class="detail">32 GB RAM / CPU + GPU offload</text>
  <text x="44" y="391" class="kicker">LOCAL MODELS / MEASURED TRADEOFFS / REUSABLE WORKFLOWS</text>
</svg>
